# 버전 브랜치를 새로 자르면 install.sh 안의 버전 표기를 그 브랜치로 자동으로 맞춘다.
#
# 왜 필요한가 — 설치 명령이
#   curl -fsSL .../heysenlyt_pi/{버전}/install.sh | sudo bash -s -- {서버}
# 형태라 URL 의 {버전} 이 곧 "설치될 pi 코드"여야 하는데, 파이프로 실행되는 스크립트는
# 자기가 어느 URL 에서 왔는지 알 수 없다. 그래서 install.sh 안에 자기 브랜치를 적어 두는데,
# 그 한 줄을 사람이 브랜치 만들 때마다 고치지 않도록 자동화한다.
#
# ci.yml 의 "install.sh BRANCH 기본값 == 이 브랜치" 검사는 이게 안 돌았을 때의 뒷받침이다.

name: Pin install.sh branch

on:
  create:

permissions:
  contents: write

jobs:
  pin:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: install.sh 의 버전 표기를 이 브랜치로 맞춘다
        run: |
          set -euo pipefail
          B="${{ github.ref_name }}"

          case "$B" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "ℹ️ '$B' 는 버전 브랜치 형식이 아니다 — 건너뜀"; exit 0 ;;
          esac

          cur=$(sed -n 's/^BRANCH="\${SENLYT_INSTALL_BRANCH:-\(.*\)}"$/\1/p' install.sh)
          [ -n "$cur" ] || { echo "::error::install.sh 에서 BRANCH 기본값 줄을 못 찾았다 — 형식이 바뀌었는지 확인"; exit 1; }

          # ① 동작을 결정하는 줄  ② 설치 명령 예시 URL  ③ 그 옆 설명의 버전 표기
          sed -i \
            -e "s|^BRANCH=\"\\\${SENLYT_INSTALL_BRANCH:-.*}\"$|BRANCH=\"\\\${SENLYT_INSTALL_BRANCH:-$B}\"|" \
            -e "s|/heysenlyt_pi/v[0-9][0-9.]*/install\.sh|/heysenlyt_pi/$B/install.sh|g" \
            -e "s|놓인 브랜치(v[0-9][0-9.]* —|놓인 브랜치($B —|g" \
            install.sh

          if git diff --quiet -- install.sh; then
            echo "✅ 이미 $B 에 맞춰져 있다 — 변경 없음"
            exit 0
          fi

          echo "--- 변경 내용 ---"
          git --no-pager diff -- install.sh

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "chore: install.sh 버전 표기를 $B 로 맞춤 (브랜치 생성 자동 감지)

          BRANCH 기본값 $cur → $B. 이 커밋이 없으면 $B 의 install.sh 가 $cur 코드를 설치한다." install.sh
          git push origin "HEAD:$B"
          echo "✅ $B 에 맞춰 커밋했다"
