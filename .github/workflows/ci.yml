# heysenlyt-pi CI — 검증 게이트 (배포 아님).
#
# ⚠️ pi 는 "실배포(CD)" 개념이 없다(물리 기기·수동 프로비저닝). 그래서 이 CI 는 배포를 하지 않고
#    **검증만** 한다(CI ≠ CD):
#      ① pytest 전체 — 안전-크리티컬(서버타깃·펌프명령·전이표·멱등) 회귀 방지
#      ② 브랜치→환경 규칙 검증 — 배포 브랜치(main·dev·vX.Y.Z)면 branch_to_env 파생이 성공해야 통과
#    실기 서버 타겟 안전(브랜치→SENLYT_ENV)의 주(主) 관문은 로컬 provision(scripts/provision-env.sh)이고,
#    이 CI 는 그 규칙·테스트가 push 마다 깨지지 않게 겹쳐 막는 defense-in-depth 다(02_infra §4.9).
name: CI

on:
  push:
    branches: ["v*.*.*"]   # pi 는 환경 브랜치를 두지 않는다 — 제품 버전 브랜치만
  # 수동 재실행용 (Actions 탭에서 브랜치 선택 후 Run workflow)
  workflow_dispatch:

# ⛔ `pull_request` 트리거를 두지 않는다 (2026-08-17) — heysenlyt-web 워크플로 3종과 같은 방식
#   (web 은 deploy-dev·deploy-prod·deploy-version 전부 `push` + `workflow_dispatch` 뿐이다).
#
#   전에는 `pull_request:` 가 브랜치 필터 없이 있어서 승격 PR 마다 **같은 커밋에 CI 가 두 번** 돌았다.
#   실측(2026-08-17 · gh run list):
#       #62 push          v1.3.0  1edf512
#       #63 pull_request  v1.3.0  1edf512   ← 같은 커밋
#       #64 push          dev     c94f13d
#       #65 pull_request  dev     c94f13d   ← 같은 커밋
#       #66 push          main    0bda2ba
#   `concurrency` 로도 못 막는다 — push 는 ref_name 이 `v1.3.0`, PR 은 `10/merge` 라 그룹이 갈린다.
#
#   ⚠️ 잃는 것을 정직하게 적어둔다 — dev·main 은 **PR 머지로만** 도달하므로, 없앤 `pull_request` 가
#     "머지 전 게이트" 였다. 지금은 머지( = dev/main 으로의 push)와 **동시에** 검증되므로, 깨진 코드는
#     막히는 게 아니라 **올라간 직후에 드러난다.** 이걸 감수할 수 있는 이유는 두 가지다:
#       ① 승격은 이미 검증된 버전 브랜치 커밋을 옮기는 것이라 머지 결과가 대개 같은 트리다
#       ② pi CI 는 배포가 아니라 검증 게이트라, 실패해도 기기에 자동으로 나가지 않는다
#     ⇒ 충돌 해소가 섞이는 승격이나 dev/main 직접 push 를 하게 되면 이 결정을 다시 본다.

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable + dev)
        run: pip install -e ".[dev]"
      - name: pytest (전체 — 안전 회귀 게이트)
        run: python -m pytest -q
      - name: 브랜치 → 환경 규칙 검증 (배포 브랜치는 env 파생 성공 필수)
        run: |
          BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            main|dev|v[0-9]*.[0-9]*.[0-9]*)
              ENV="$(python -c "import sys; from senlyt_pi.config.server_target import branch_to_env; e=branch_to_env(sys.argv[1]); print(e) if e else sys.exit(1)" "$BRANCH")" \
                || { echo "::error::배포 브랜치 '$BRANCH' 가 알려진 환경으로 매핑되지 않습니다(branch_to_env)."; exit 1; }
              echo "✅ '$BRANCH' → SENLYT_ENV=$ENV (로컬 provision 이 실기에 각인할 값)"
              ;;
            *)
              echo "ℹ️ 비배포 브랜치 '$BRANCH' — 환경 검증 스킵(테스트만)."
              ;;
          esac

      - name: install.sh 문법·브랜치 무관성 (2026-09-11 — 소스는 SENLYT_INSTALL_REF/서버 URL 로 정한다)
        run: |
          bash -n install.sh
          if grep -qE '^BRANCH="\$\{SENLYT_INSTALL_BRANCH:-' install.sh; then echo "::error::install.sh 에 브랜치 하드코딩이 되살아났다 — 소스는 REF/서버 URL 유추로만"; exit 1; fi
          echo "✅ install.sh 는 브랜치와 무관한 한 벌이다"
